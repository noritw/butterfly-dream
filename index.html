<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>蝶夢莊周</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070f;
    --panel-rgb: 7, 11, 24;
    --kt: #a8d2ff;      /* 紀天行：冷色、偏亮 */
    --yt: #ffbf73;      /* 汪逸彤：暖色 */
    --narr: #8e93ad;    /* 旁白：灰、較暗 */
    --news: #e9e9ef;    /* 新聞：白，左邊一條線 */
    --line: rgba(160, 190, 255, 0.18);
    --pw: 760px;        /* 桌面版文字區寬度（含漸層），由 JS 依視窗寬度設定 */
    --sh: 60vh;         /* 手機版圖片高度，由 JS 設定 */
    --fade: 96px;       /* 手機版圖片與文字之間的漸層高度 */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--narr); overflow: hidden; }
  body { font-family: "Noto Serif TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", serif; -webkit-tap-highlight-color: transparent; user-select: none; }

  /* 圖層：stage（圖）< fxBack（環境粒子、蝴蝶）< panel（文字）< fxFront（滑鼠氣流、點擊噴發）< UI */
  #stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; background: #000; z-index: 0; touch-action: none; transition: background 2s; }
  #frame { position: absolute; transform-origin: 0 0; transition: transform 5s cubic-bezier(.4,0,.2,1); will-change: transform; }
  #frame img, #frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #frame img { transition: opacity 2.5s ease, filter 2.5s ease; opacity: 0; }
  /* 開場的螢幕：亮的那一塊與照到房間的光，各自用 screen 混合疊上去，由 JS 控制閃動 */
  #screenRect, #spill { position: absolute; pointer-events: none; opacity: 0; mix-blend-mode: screen; }
  /* 圖上的螢幕本來就畫成亮的：用一層深色蓋上去才能讓它變暗、關掉 */
  #screenDim { position: absolute; pointer-events: none; opacity: 0; background: rgb(8, 12, 24); border-radius: 3px; }
  #screenRect { border-radius: 3px; filter: blur(1.5px); }
  #spill { inset: 0; }
  /* 還沒有螢幕圖時的暫代：畫一個發光的方框 */
  #frame.noroom #screenRect { mix-blend-mode: normal; filter: none; box-shadow: 0 0 80px 18px rgba(120,170,255,.28), 0 0 0 6px #0d111c; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.on { animation: flash 0.9s ease-out; }
  @keyframes flash { 0% { opacity: 0.85; } 100% { opacity: 0; } }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 40% 60%, transparent 55%, rgba(0,0,0,0.5) 100%); }
  .fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #fxBack { z-index: 1; }
  #fxFront { z-index: 3; }

  #panel { position: fixed; top: 0; bottom: 0; right: 0; width: var(--pw); z-index: 2; display: flex; flex-direction: column; cursor: pointer; }
  /* 漸層底：左邊透明、往右變成純色，文字從圖上浮出來 */
  #panel::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(to right, rgba(var(--panel-rgb), 0) 0%, rgba(var(--panel-rgb), .55) 16%, rgba(var(--panel-rgb), .86) 30%, rgba(var(--panel-rgb), .94) 42%); }
  #log { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 56px 44px 96px calc(var(--pw) * 0.3); scrollbar-width: thin; scrollbar-color: rgba(160,190,255,.25) transparent; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 40px); mask-image: linear-gradient(to bottom, transparent 0, #000 40px); }
  .l { margin: 0 0 0.55em; line-height: 1.85; font-size: 17px; letter-spacing: 0.02em; opacity: 0; transform: translateY(6px); transition: opacity .5s ease, transform .5s ease; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .l.show { opacity: 1; transform: none; }
  .l.gap { margin-top: 1.4em; }
  .kt { color: var(--kt); }
  .yt { color: var(--yt); }
  .narr { color: var(--narr); font-size: 15.5px; }
  .news { color: var(--news); border-left: 2px solid rgba(233,233,239,.5); padding-left: 12px; font-size: 15.5px; }
  .act { color: var(--narr); font-size: 0.88em; margin-right: 0.3em; }
  #more { position: absolute; right: 30px; bottom: 28px; width: 10px; height: 10px; border-right: 2px solid rgba(168,210,255,.7); border-bottom: 2px solid rgba(168,210,255,.7); transform: rotate(45deg); opacity: 0; transition: opacity .3s; animation: bob 1.4s ease-in-out infinite; }
  #more.on { opacity: 1; }
  @keyframes bob { 50% { translate: 0 4px; } }

  #ui { position: fixed; top: 14px; left: 14px; z-index: 5; display: flex; gap: 8px; }
  #ui button { font: inherit; font-size: 13px; color: #cfd8ff; background: rgba(10,14,30,.55); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; backdrop-filter: blur(4px); }
  #ui button:hover { background: rgba(30,40,80,.7); }

  #cover, #endcard { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(ellipse at 50% 40%, #0c1430 0%, #03040a 70%); color: #dfe6ff; transition: opacity 1.5s ease; padding: 24px; }
  #cover h1, #endcard h1 { font-weight: 600; font-size: clamp(34px, 7vw, 56px); letter-spacing: .35em; margin: 0 0 .4em .35em; text-shadow: 0 0 24px rgba(90,160,255,.55); }
  #cover p, #endcard p { margin: .3em 0; color: #9aa6cc; font-size: 14px; letter-spacing: .1em; }
  #cover button, #endcard button { margin-top: 2em; font: inherit; font-size: 16px; letter-spacing: .3em; color: #e8eeff; background: transparent; border: 1px solid rgba(160,200,255,.45); border-radius: 999px; padding: 10px 34px 10px 40px; cursor: pointer; transition: background .3s, box-shadow .3s; }
  #cover button:hover, #endcard button:hover { background: rgba(90,150,255,.12); box-shadow: 0 0 18px rgba(90,160,255,.35); }
  .hidden { opacity: 0; pointer-events: none; }
  #endcard { background: rgba(3,4,10,.82); transition: opacity 3s ease; }

  /* 手機（直式或窄螢幕）：圖在上、文字在下，交界用漸層蓋過去 */
  body.mobile #stage { height: var(--sh); }
  body.mobile #panel { left: 0; width: 100%; top: calc(var(--sh) - var(--fade)); }
  body.mobile #panel::before { background: linear-gradient(to bottom, rgba(var(--panel-rgb), 0) 0, rgba(var(--panel-rgb), .9) calc(var(--fade) * .75), rgba(var(--panel-rgb), .96) var(--fade)); }
  body.mobile #log { padding: calc(var(--fade) + 4px) 22px 72px; -webkit-mask-image: none; mask-image: none; }
  body.mobile .l { font-size: 16px; }
  body.mobile .narr, body.mobile .news { font-size: 14.5px; }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <img id="room" src="screen.jpg" alt="">
    <div id="spill"></div>
    <div id="screenDim"></div>
    <div id="screenRect"></div>
    <img id="photo" src="bridge.jpg" alt="兩人牽著腳踏車，站在橋上看夜景的背影">
    <canvas id="twinkle"></canvas>
  </div>
  <div id="vignette"></div>
  <div id="flash"></div>
</div>
<canvas id="fxBack" class="fx"></canvas>
<div id="panel">
  <div id="log" aria-live="polite"></div>
  <div id="more"></div>
</div>
<canvas id="fxFront" class="fx"></canvas>

<div id="ui">
  <button id="mute" type="button">聲音：開</button>
</div>

<div id="cover">
  <h1>蝶夢莊周</h1>
  <p>心動除錯　後日談</p>
  <p style="margin-top:1.6em">※ 含後日談內容　建議開啟聲音</p>
  <p>點擊畫面或按空白鍵繼續</p>
  <button id="start" type="button">開始</button>
</div>

<div id="endcard" class="hidden">
  <h1>蝶夢莊周</h1>
  <p>心動除錯　後日談</p>
  <button id="again" type="button">再讀一次</button>
</div>

<audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
<script src="script.js"></script>
<script>
(() => {
  "use strict";
  const SCRIPT = window.BD_SCRIPT || [];
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), frame = $("frame"), photo = $("photo"), room = $("room");
  const screenRect = $("screenRect"), screenDim = $("screenDim"), spill = $("spill");
  const twinkle = $("twinkle"), fxBack = $("fxBack"), fxFront = $("fxFront");
  const panel = $("panel"), log = $("log"), more = $("more"), bgm = $("bgm");
  const ASPECT = 1536 / 1024;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const mobileQuery = matchMedia("(max-width: 820px), (orientation: portrait)");
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  // ---------- 版面 ----------
  // region：圖看得清楚的範圍（桌面版是文字區左邊、加上半透明那一段；手機版是上半部），兩人對準它的中央。
  // cover：圖要鋪到哪裡。桌面版再往文字區底下多鋪一段，漸層變不透明之前都不會露出圖的邊。
  let W = innerWidth, H = innerHeight, mobile = false, dpr = 1;
  const region = { w: 1, h: 1, cover: 1 };
  let frameRect = { x: 0, y: 0, w: 1, h: 1 };
  function layout() {
    W = innerWidth; H = innerHeight; mobile = mobileQuery.matches; dpr = Math.min(devicePixelRatio || 1, 2);
    document.body.classList.toggle("mobile", mobile);
    if (mobile) {
      // 整張圖放在上方（不裁兩側），文字區的漸層只蓋到圖的最下緣，兩人不會被字擋住
      const fade = 56, imgH = Math.round(Math.min(W / ASPECT, H * 0.5));
      const sh = imgH + Math.round(fade * 0.5);
      document.documentElement.style.setProperty("--sh", sh + "px");
      document.documentElement.style.setProperty("--fade", fade + "px");
      region.w = region.cover = W; region.h = imgH;
    } else {
      // 文字區寬到大部分句子不用換行；漸層前段蓋在圖上
      const pw = Math.round(clamp(W * 0.56, 560, 860));
      document.documentElement.style.setProperty("--pw", pw + "px");
      region.w = W - pw * 0.58; region.cover = W - pw * 0.3; region.h = H;
    }
    // 圖的中心對準 region 中央，同時寬到能鋪滿 0..cover、高到能鋪滿 region.h
    let w = Math.max(2 * region.cover - region.w, region.h * ASPECT), h = w / ASPECT;
    const x = (region.w - w) * 0.5, y = (region.h - h) * 0.8;
    Object.assign(frame.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
    frameRect = { x, y, w, h };
    twinkle.width = Math.round(w * dpr); twinkle.height = Math.round(h * dpr);
    for (const c of [fxBack, fxFront]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    applyCamera();
    log.scrollTop = log.scrollHeight;
  }

  // ---------- 場景與鏡頭 ----------
  const SCENES = {
    black: { opacity: 0, filter: "none" },
    dusk:  { opacity: 0.75, filter: "sepia(.55) saturate(1.5) hue-rotate(-18deg) brightness(.75)" },
    night: { opacity: 1, filter: "none" },
  };
  let scene = "black", camera = "full";
  function setScene(name) {
    scene = name;
    const s = SCENES[name] || SCENES.night;
    photo.style.opacity = s.opacity;
    photo.style.filter = s.filter;
    if (name !== "black") { room.style.opacity = 0; screenOn = false; }
  }

  // ---------- 開場螢幕 ----------
  // 螢幕發亮的範圍（原圖比例）。拿到 Codex 的 screen.jpg 後照圖上的螢幕位置調整。
  const SCREEN_RECT = { x: 0.34, y: 0.206, w: 0.32, h: 0.363 };  // screen.jpg 實測
  for (const el of [screenRect, screenDim]) Object.assign(el.style, { left: SCREEN_RECT.x * 100 + "%", top: SCREEN_RECT.y * 100 + "%", width: SCREEN_RECT.w * 100 + "%", height: SCREEN_RECT.h * 100 + "%" });
  const scx = (SCREEN_RECT.x + SCREEN_RECT.w / 2) * 100, scy = (SCREEN_RECT.y + SCREEN_RECT.h / 2) * 100;
  room.addEventListener("error", () => frame.classList.add("noroom"));
  if (room.complete && !room.naturalWidth) frame.classList.add("noroom");  // 圖在腳本跑之前就載入失敗
  let screenOn = false, screenLevel = 0, screenBase = 0.8, nextCut = 0, tint = [210, 225, 255];
  function setScreen(on) {
    room.style.opacity = 1;
    room.style.filter = on ? "brightness(.9)" : "brightness(.35)";
    if (!on && screenOn) screenLevel = 1.15;  // 關掉前亮一下
    screenOn = on;
    if (on) scene = "room";
  }
  function updateScreen(dt, t) {
    if (screenOn && t > nextCut) {
      // 新聞換鏡頭：亮度和色調跳一下
      nextCut = t + rand(1.2, 3.6);
      screenBase = rand(0.55, 1);
      tint = Math.random() < 0.3 ? [255, 238, 215] : Math.random() < 0.5 ? [200, 220, 255] : [225, 235, 255];
    }
    const flick = screenOn ? screenBase + Math.sin(t * 53) * 0.025 + Math.sin(t * 9.7) * 0.03 + (Math.random() < 0.01 ? -0.15 : 0) : 0;
    screenLevel += (flick - screenLevel) * Math.min(1, dt * (screenOn ? 9 : 6));
    const lv = Math.max(0, screenLevel);
    const [r, g, b] = tint;
    screenRect.style.background = `rgb(${r},${g},${b})`;
    const placeholder = frame.classList.contains("noroom");
    screenRect.style.opacity = (placeholder ? 1 : 0.35) * Math.min(1, lv);
    screenDim.style.opacity = placeholder ? 0 : clamp(1 - lv, 0, 1) * 0.8;
    spill.style.background = `radial-gradient(ellipse 60% 70% at ${scx}% ${scy}%, rgba(${r},${g},${b},.38), transparent 70%)`;
    spill.style.opacity = Math.min(1, lv) * 0.9;
  }
  // 把原圖上的焦點移到 region 裡的指定位置並放大；夾住平移量，放大後仍蓋滿 region。月亮在原圖約 (0.853, 0.124)。
  const SHOTS = {
    full: { fx: 0.5, fy: 0.72, sx: null, sy: null, s: 1.04 },
    moon: { fx: 0.853, fy: 0.124, sx: 0.5, sy: 0.42, s: 1.6 },
  };
  function applyCamera() {
    const shot = SHOTS[camera] || SHOTS.full;
    const { x, y, w, h } = frameRect;
    const s = reduceMotion && camera === "full" ? 1 : shot.s;
    const px = shot.fx * w, py = shot.fy * h;
    const targetX = shot.sx === null ? x + px : region.w * shot.sx;
    const targetY = shot.sy === null ? y + py : region.h * shot.sy;
    const tx = clamp(targetX - x - s * px, region.cover - x - s * w, -x);
    const ty = clamp(targetY - y - s * py, region.h - y - s * h, -y);
    frame.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  }

  // ---------- 貼圖 ----------
  function glowSprite(r, color) {
    const c = document.createElement("canvas"); c.width = c.height = r * 2;
    const g = c.getContext("2d"), grd = g.createRadialGradient(r, r, 0, r, r, r);
    grd.addColorStop(0, color(1)); grd.addColorStop(0.25, color(0.55)); grd.addColorStop(1, color(0));
    g.fillStyle = grd; g.fillRect(0, 0, r * 2, r * 2); return c;
  }
  const blueDot = glowSprite(32, (a) => `rgba(120,190,255,${a})`);
  const whiteDot = glowSprite(24, (a) => `rgba(220,240,255,${a})`);
  const warmDot = glowSprite(24, (a) => `rgba(255,190,110,${a})`);
  // 發光花瓣：細長水滴形，中心亮、邊緣藍
  const petal = (() => {
    const c = document.createElement("canvas"); c.width = 48; c.height = 24;
    const g = c.getContext("2d");
    g.shadowColor = "rgba(110,190,255,.9)"; g.shadowBlur = 8;
    const grd = g.createLinearGradient(6, 12, 42, 12);
    grd.addColorStop(0, "rgba(200,235,255,.95)"); grd.addColorStop(1, "rgba(70,150,255,.7)");
    g.fillStyle = grd;
    g.beginPath(); g.moveTo(6, 12);
    g.bezierCurveTo(14, 2, 34, 2, 42, 12); g.bezierCurveTo(34, 22, 14, 22, 6, 12);
    g.fill(); return c;
  })();

  // ---------- 粒子 ----------
  const bctx = fxBack.getContext("2d"), fctx = fxFront.getContext("2d"), tctx = twinkle.getContext("2d");

  // 城市燈火閃爍：原圖上橋下城市與河面那一帶
  const lights = Array.from({ length: 70 }, () => ({ x: rand(0.02, 0.98), y: rand(0.47, 0.70), s: rand(0.3, 1), p: rand(0, 6.28), f: rand(0.4, 1.6) }));
  // 天上呼吸的藍色光點（region 比例座標）
  const sparks = Array.from({ length: 22 }, () => ({ x: Math.random(), y: rand(0.05, 0.6), p: rand(0, 6.28), s: rand(0.3, 0.9) }));

  // 漂浮的藍色粒子（像素座標，整個視窗）。被氣流吹到時會加速、轉圈
  const motes = [];
  function makeMote(anyY) {
    return { x: rand(0, W), y: anyY ? rand(0, H) : H + 10, vx: rand(-6, 6), vy: rand(-22, -6), r: rand(0.4, 1.1), a: 0, life: rand(0.6, 1), p: rand(0, 6.28) };
  }
  // 被滑鼠／手指攪起來、或點擊噴出來的光點與花瓣（畫在文字上面，很快就淡掉）
  const stirred = [];
  const MAX_STIRRED = 320;
  function addStirred(x, y, vx, vy, kind, life) {
    if (stirred.length >= MAX_STIRRED) stirred.shift();
    stirred.push({ x, y, vx, vy, kind, life, age: 0, rot: rand(0, 6.28), spin: rand(-6, 6), flip: rand(0, 6.28), size: kind === "petal" ? rand(0.5, 1) : rand(0.4, 1) });
  }

  // 指標：記位置與速度，速度就是「氣流」
  const pointer = { x: -9999, y: -9999, vx: 0, vy: 0, active: false, t: 0, dist: 0 };
  function onMove(e) {
    const now = performance.now();
    if (pointer.active) {
      const dt = Math.max(8, now - pointer.t) / 1000;
      const dx = e.clientX - pointer.x, dy = e.clientY - pointer.y;
      pointer.vx = pointer.vx * 0.5 + (dx / dt) * 0.5;
      pointer.vy = pointer.vy * 0.5 + (dy / dt) * 0.5;
      // 沿著路徑每移動一段距離，攪起一顆光點或花瓣
      pointer.dist += Math.hypot(dx, dy);
      // 只輕輕帶一下，不要像灑水：初速很小，之後靠飄動
      const speed = Math.hypot(pointer.vx, pointer.vy);
      while (pointer.dist > 22) {
        pointer.dist -= 22;
        if (speed < 60) break;
        const push = rand(0.03, 0.08);
        addStirred(e.clientX + rand(-14, 14), e.clientY + rand(-14, 14),
          clamp(pointer.vx * push, -70, 70) + rand(-10, 10), clamp(pointer.vy * push, -70, 70) + rand(-10, 10),
          Math.random() < 0.35 ? "petal" : "dot", rand(1.8, 3.2));
      }
    }
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.t = now; pointer.active = true;
  }
  addEventListener("pointermove", (e) => {
    // 手機只有手指按著滑動時才有氣流
    if (e.pointerType === "touch" && e.buttons === 0) return;
    onMove(e);
  }, { passive: true });
  addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.t = performance.now(); pointer.active = true; pointer.vx = pointer.vy = 0;
    burst(e.clientX, e.clientY);
  }, { passive: true });
  addEventListener("pointerup", (e) => { if (e.pointerType === "touch") pointer.active = false; }, { passive: true });
  document.addEventListener("pointerleave", () => { pointer.active = false; });
  // 點擊：往四周噴出發光粒子
  function burst(x, y) {
    const n = 18;
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2 + rand(-0.25, 0.25), sp = rand(40, 130);
      addStirred(x, y, Math.cos(ang) * sp, Math.sin(ang) * sp, Math.random() < 0.3 ? "petal" : "dot", rand(1.4, 2.4));
    }
  }

  // ---------- 蝴蝶 ----------
  const bfImg = new Image(); bfImg.src = "butterfly.png";
  const butterflies = [];
  let bfTarget = 0;
  function spawnButterfly() {
    const fromLeft = Math.random() < 0.5;
    return { x: fromLeft ? -40 : region.w + 40, y: rand(region.h * 0.15, region.h * 0.7), heading: fromLeft ? 0 : Math.PI,
      speed: rand(28, 46), size: rand(22, 40), phase: rand(0, 6.28), flap: rand(7, 10), a: 0, leaving: false, turn: rand(-1, 1),
      home: { x: rand(0.1, 0.9), y: rand(0.1, 0.62) } };
  }
  function setButterflies(n) {
    bfTarget = n;
    const alive = butterflies.filter((b) => !b.leaving);
    for (let i = alive.length; i < n; i++) butterflies.push(spawnButterfly());
    for (let i = n; i < alive.length; i++) alive[i].leaving = true;
  }

  // ---------- 每一格 ----------
  let last = performance.now(), t = 0;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
    const night = scene === "night" ? 1 : scene === "dusk" ? 0.35 : 0;
    pointer.vx *= Math.pow(0.02, dt); pointer.vy *= Math.pow(0.02, dt);  // 停下來後氣流很快就散
    updateScreen(dt, t);

    // 燈火（在 frame 裡，跟著鏡頭）
    tctx.setTransform(1, 0, 0, 1, 0, 0);
    tctx.clearRect(0, 0, twinkle.width, twinkle.height);
    if (night > 0) {
      tctx.globalCompositeOperation = "lighter";
      const TW = twinkle.width, TH = twinkle.height;
      for (const L of lights) {
        const k = 0.5 + 0.5 * Math.sin(t * L.f + L.p), a = night * L.s * k * k * 0.55;
        if (a < 0.02) continue;
        const r = (6 + 10 * L.s) * (TW / 1536);
        tctx.globalAlpha = a; tctx.drawImage(warmDot, L.x * TW - r, L.y * TH - r, r * 2, r * 2);
      }
      tctx.globalAlpha = 1; tctx.globalCompositeOperation = "source-over";
    }

    // 後層：環境粒子、光點、蝴蝶
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bctx.clearRect(0, 0, W, H);
    bctx.globalCompositeOperation = "lighter";

    // 粒子數量：沒圖時留幾顆微光，夜景隨蝴蝶變多
    const base = (W * H) / (900 * 600);
    const wantMotes = Math.round((night > 0 ? 26 + bfTarget * 4 : 10) * base);
    const moteAlpha = night > 0 ? night : 0.35;
    while (motes.length < wantMotes) motes.push(makeMote(true));
    const flow = Math.hypot(pointer.vx, pointer.vy);
    for (let i = motes.length - 1; i >= 0; i--) {
      const m = motes[i];
      m.p += dt;
      // 氣流：指標附近的粒子被指標的速度帶著走，再加一點旋渦
      if (pointer.active && flow > 20) {
        const dx = m.x - pointer.x, dy = m.y - pointer.y, d = Math.hypot(dx, dy), R = 170;
        if (d < R) {
          const f = (1 - d / R) * (1 - d / R);
          m.vx += pointer.vx * f * dt * 1.1 + (-dy / (d + 1)) * flow * f * dt * 0.35;
          m.vy += pointer.vy * f * dt * 1.1 + (dx / (d + 1)) * flow * f * dt * 0.35;
        }
      }
      m.vx += Math.sin(m.p * 0.7) * 3 * dt;
      m.vx *= Math.pow(0.35, dt); m.vy = m.vy * Math.pow(0.35, dt) + (-14 - m.vy) * 0.6 * dt;
      m.x += m.vx * dt; m.y += m.vy * dt;
      const over = motes.length > wantMotes;
      m.a += ((over ? 0 : m.life) - m.a) * dt * 0.8;
      if (m.y < -20 || m.x < -40 || m.x > W + 40 || (over && m.a < 0.02)) {
        if (over) motes.splice(i, 1); else Object.assign(m, makeMote(false));
        continue;
      }
      const r = 7 * m.r * (1 + Math.min(1.2, Math.hypot(m.vx, m.vy) / 240));
      bctx.globalAlpha = m.a * (0.6 + 0.4 * Math.sin(m.p * 2.3)) * moteAlpha;
      bctx.drawImage(blueDot, m.x - r, m.y - r, r * 2, r * 2);
    }

    for (const s of sparks) {
      const k = Math.max(0, Math.sin(t * 0.9 * s.s + s.p)), a = night * k * k * (0.25 + bfTarget / 22);
      if (a < 0.02) continue;
      const r = 10 + 8 * s.s;
      bctx.globalAlpha = Math.min(1, a);
      bctx.drawImage(blueDot, s.x * region.w - r, s.y * region.h - r, r * 2, r * 2);
    }

    if (bfImg.complete && bfImg.naturalWidth) {
      for (let i = butterflies.length - 1; i >= 0; i--) {
        const b = butterflies[i];
        b.turn += rand(-1.5, 1.5) * dt; b.turn *= 0.97; b.heading += b.turn * dt;
        if (!b.leaving) {
          const cx = region.w * b.home.x, cy = region.h * b.home.y;
          const toC = Math.atan2(cy - b.y, cx - b.x), far = Math.hypot(cx - b.x, cy - b.y) / Math.max(region.w, region.h);
          b.heading += Math.sin(toC - b.heading) * dt * (0.4 + far * 2.2);
        } else {
          b.heading += Math.sin(-Math.PI / 2 - b.heading) * dt * 1.5;
        }
        // 氣流經過時，蝴蝶被吹得偏一下
        if (pointer.active) {
          const dx = b.x - pointer.x, dy = b.y - pointer.y, d = Math.hypot(dx, dy);
          if (d < 130) {
            b.heading += Math.sin(Math.atan2(dy, dx) - b.heading) * dt * 3;
            b.x += pointer.vx * (1 - d / 130) * dt * 0.6; b.y += pointer.vy * (1 - d / 130) * dt * 0.6;
          }
        }
        const sp = b.speed * (b.leaving ? 1.6 : 1);
        b.x += Math.cos(b.heading) * sp * dt; b.y += Math.sin(b.heading) * sp * dt + Math.sin(t * 3 + b.phase) * 6 * dt;
        b.a += ((b.leaving ? 0 : 1) - b.a) * dt * (b.leaving ? 0.7 : 0.9);
        if (b.leaving && (b.a < 0.02 || b.y < -60)) { butterflies.splice(i, 1); continue; }
        b.phase += b.flap * dt;
        const open = 0.25 + 0.75 * Math.abs(Math.sin(b.phase)), w = b.size * 1.42, h = b.size, gr = b.size * 1.3;
        bctx.save();
        bctx.translate(b.x, b.y); bctx.rotate(b.heading + Math.PI / 2);
        bctx.globalAlpha = b.a * 0.55 * night; bctx.drawImage(blueDot, -gr, -gr, gr * 2, gr * 2);
        bctx.globalAlpha = b.a * night; bctx.scale(open, 1); bctx.drawImage(bfImg, -w / 2, -h / 2, w, h);
        bctx.restore();
      }
    }

    // 前層：攪起來的光點與花瓣
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fctx.clearRect(0, 0, W, H);
    fctx.globalCompositeOperation = "lighter";
    for (let i = stirred.length - 1; i >= 0; i--) {
      const p = stirred[i];
      p.age += dt;
      if (p.age >= p.life) { stirred.splice(i, 1); continue; }
      // 很快慢下來，之後左右搖擺、慢慢往上飄（花瓣搖得比光點明顯）
      p.vx *= Math.pow(0.25, dt); p.vy *= Math.pow(0.25, dt);
      const sway = p.kind === "petal" ? 26 : 12;
      p.x += (p.vx + Math.sin(p.flip * 0.9) * sway) * dt;
      p.y += (p.vy - 9 + Math.cos(p.flip * 0.7) * 5) * dt;
      p.rot += p.spin * 0.35 * dt; p.flip += 2.2 * dt;
      const k = p.age / p.life, a = (k < 0.15 ? k / 0.15 : 1 - (k - 0.15) / 0.85);
      fctx.globalAlpha = Math.max(0, a) * 0.9;
      if (p.kind === "petal") {
        fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.rot);
        fctx.scale(p.size, p.size * (0.35 + 0.65 * Math.abs(Math.cos(p.flip))));  // 翻轉的花瓣
        fctx.drawImage(petal, -24, -12);
        fctx.restore();
      } else {
        const r = 9 * p.size;
        fctx.drawImage(blueDot, p.x - r, p.y - r, r * 2, r * 2);
        fctx.drawImage(whiteDot, p.x - r * 0.35, p.y - r * 0.35, r * 0.7, r * 0.7);
      }
    }
    fctx.globalAlpha = 1; fctx.globalCompositeOperation = "source-over";
    bctx.globalAlpha = 1; bctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(loop);
  }

  // ---------- 文字 ----------
  let idx = -1, typing = null, finished = false;
  const CPS = 28;
  function applyCues(step) {
    for (const c of step.cues || []) {
      if (c.scene) setScene(c.scene);
      if (c.camera) { camera = c.camera; applyCamera(); }
      if ("butterflies" in c) setButterflies(c.butterflies);
      if (c.flash) shutter();
      if (c.screen) setScreen(c.screen === "on");
    }
  }
  function showStep(step) {
    applyCues(step);
    const d = document.createElement("p");
    d.className = "l " + step.who + (step.gap ? " gap" : "");
    if (step.action) { const a = document.createElement("span"); a.className = "act"; a.textContent = "（" + step.action + "）"; d.appendChild(a); }
    const body = document.createElement("span"); d.appendChild(body);
    log.appendChild(d);
    requestAnimationFrame(() => d.classList.add("show"));
    more.classList.remove("on");
    const full = step.text; let n = 0;
    const tick = () => {
      n += 1; body.textContent = full.slice(0, n);
      log.scrollTop = log.scrollHeight;
      if (n >= full.length) { typing = null; more.classList.add("on"); return; }
      typing.timer = setTimeout(tick, 1000 / CPS);
    };
    typing = { finish() { clearTimeout(this.timer); body.textContent = full; typing = null; more.classList.add("on"); log.scrollTop = log.scrollHeight; } };
    tick();
  }
  function advance() {
    if (finished) return;
    if (typing) { typing.finish(); return; }
    idx += 1;
    if (idx >= SCRIPT.length) { end(); return; }
    showStep(SCRIPT[idx]);
  }
  function end() {
    finished = true; more.classList.remove("on");
    setTimeout(() => $("endcard").classList.remove("hidden"), 3500);
    fadeAudio(0, 6000);
  }

  // ---------- 聲音 ----------
  let muted = false;
  const shutterSe = new Audio("shutter.mp3"); shutterSe.preload = "auto"; shutterSe.volume = 0.8;
  function shutter() {
    const f = $("flash"); f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");
    if (muted) return;
    shutterSe.currentTime = 0;
    shutterSe.play().catch(() => { /* 沒有音效也能讀 */ });
  }
  let fadeTimer = null;
  function fadeAudio(to, ms) {
    clearInterval(fadeTimer);
    const from = bgm.volume, start = performance.now();
    fadeTimer = setInterval(() => {
      const k = Math.min(1, (performance.now() - start) / ms);
      bgm.volume = from + (to - from) * k;
      if (k >= 1) { clearInterval(fadeTimer); if (to === 0) bgm.pause(); }
    }, 50);
  }
  $("mute").addEventListener("click", (e) => {
    e.stopPropagation(); muted = !muted; bgm.muted = muted; $("mute").textContent = muted ? "聲音：關" : "聲音：開";
  });

  // ---------- 開始、操作 ----------
  const coverOpen = () => !$("cover").classList.contains("hidden");
  function begin() {
    $("cover").classList.add("hidden");
    bgm.volume = 0; bgm.currentTime = 0;
    bgm.play().then(() => fadeAudio(0.55, 4000)).catch(() => {});
    setTimeout(advance, 900);
  }
  $("start").addEventListener("click", (e) => { e.stopPropagation(); begin(); });
  $("again").addEventListener("click", (e) => {
    e.stopPropagation();
    $("endcard").classList.add("hidden");
    log.innerHTML = ""; idx = -1; finished = false;
    setScene("black"); room.style.opacity = 0; screenLevel = 0; camera = "full"; applyCamera(); setButterflies(0);
    begin();
  });
  // 點畫面任何地方都能前進（圖、文字區都算）
  for (const el of [stage, panel]) el.addEventListener("click", () => { if (!coverOpen()) advance(); });
  addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "Enter" || e.code === "ArrowRight") {
      e.preventDefault();
      if (coverOpen()) begin(); else advance();
    }
  });

  mobileQuery.addEventListener("change", layout);
  addEventListener("resize", layout);
  layout(); setScene("black");
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
